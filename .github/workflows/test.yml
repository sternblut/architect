name: tests

on:
  pull_request:
  push:
    branches: [main, build]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # One process per file: each test sets its state folder before importing modules, which a shared process would share
      - run: for f in test/*.test.ts; do bun test "$f" || exit 1; done
