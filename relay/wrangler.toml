# The architect's cloud relay (answers in Telegram while the Mac sleeps) and the connection mailbox. No secrets (src/index.ts).
name = "archi-relay"
main = "src/index.ts"
compatibility_date = "2026-09-30"
workers_dev = true
send_metrics = false

# request logs off: the webhook URL contains a path only Telegram and the Mac may know
[observability]
enabled = false

[vars]
# the Mac's public key, not a secret: `bun src/relay-key.ts` on the Mac prints it
MAC_KEY = ""

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# connection mailbox: the manager's envelope for 15 minutes, ciphertext only (src/box.ts)
[[durable_objects.bindings]]
name = "BOX"
class_name = "Box"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Box"]
